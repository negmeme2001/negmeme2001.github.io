<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Mohamed Ahmed Negm</title>
  <meta name="description" content="Page not found on Mohamed Ahmed Negm's portfolio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #111827;
      --text-muted: #4b5563;
      --border: #e5e7eb;
      --accent: #0f766e;
      --accent-hover: #0d625b;
      --on-accent: #ffffff;
      --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f14;
        --surface: #121821;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --border: #232d3b;
        --accent: #2dd4bf;
        --accent-hover: #5eead4;
        --on-accent: #042f2e;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 1rem;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 52rem;
      margin: 0 auto;
      padding: 3rem 1.25rem;
    }

    .card {
      max-width: 36rem;
    }

    .code {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      color: var(--accent);
      margin: 0 0 0.5rem;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.2;
      margin: 0 0 0.75rem;
    }

    p {
      color: var(--text-muted);
      margin: 0 0 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.55rem 1rem;
      border-radius: 7px;
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: none;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--on-accent);
    }

    .btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    footer .inner {
      max-width: 52rem;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or has moved.</p>
      <a class="btn" href="/">Back to portfolio</a>
    </div>
  </main>
  <footer>
    <div class="inner">© 2026 Mohamed Ahmed Negm</div>
  </footer>
</body>
</html>
